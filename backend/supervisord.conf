[supervisord]
nodaemon=true

[program:gunicorn]
command = watchmedo auto-restart --directory=/app --pattern=*.py -- gunicorn -b 0.0.0.0:8080 --timeout 180 --graceful-timeout 30 --keep-alive 5 app:app --reload
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/gunicorn.err.log
stdout_logfile=/var/log/gunicorn.out.log
# OCR bolla richiede fino ~90s verso OpenAI; Cloudflare taglia a ~100s.
# Se il worker resta a timeout 30s (default gunicorn) → 502 senza CORS lato browser.
